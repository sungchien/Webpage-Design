<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 30px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    display: inline-block;
  }
  .container {
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 40px;
    box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.05);
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 1100px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 16px;
  }
  .header-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: white;
  }
  .header-title {
    font-size: 22px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
  }
  .header-subtitle {
    font-size: 14px;
    color: #64748b;
    margin-top: 2px;
  }
  .flow-row {
    display: flex;
    align-items: stretch;
    gap: 16px;
  }
  .card {
    flex: 1;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    transition: all 0.2s;
  }
  .card.highlight {
    background: #f0fdf4;
    border-color: #86efac;
    box-shadow: 0 4px 20px rgba(34, 197, 94, 0.12);
  }
  .card.primary {
    background: #eff6ff;
    border-color: #93c5fd;
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12);
  }
  .card.purple {
    background: #faf5ff;
    border-color: #d8b4fe;
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.12);
  }
  .card.amber {
    background: #fffbeb;
    border-color: #fde68a;
    box-shadow: 0 4px 20px rgba(245, 158, 11, 0.12);
  }
  .card-tag {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 9999px;
    width: fit-content;
  }
  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: #1e293b;
  }
  .card-desc {
    font-size: 14px;
    color: #475569;
    line-height: 1.6;
  }
  .card-list {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
    color: #475569;
    line-height: 1.6;
  }
  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 24px;
    font-weight: bold;
    padding: 0 4px;
  }
</style></head><body>
<div class="container" style="width: 980px;">
  <div class="header">
    <div class="header-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">💡</div>
    <div>
      <div class="header-title">企劃思維模式轉變：從隨便提問到藍圖建構</div>
      <div class="header-subtitle">成為專案的產品經理 (Product Manager)，掌控 Single Source of Truth</div>
    </div>
  </div>
  <div class="flow-row">
    <div class="card" style="background: #fef2f2; border-color: #fca5a5;">
      <div class="card-tag" style="background: #fee2e2; color: #b91c1c;">❌ 傳統迷思 (Garbage In)</div>
      <div class="card-title">直接叫 AI 寫代碼</div>
      <div class="card-desc">
        「幫我做一個很潮的咖啡廳網站。」<br>
        <strong>後果：</strong><br>
        • AI 只能憑空瞎猜通靈<br>
        • 產出毫無靈魂的千篇一律公版<br>
        • 充斥假字假圖與錯誤邏輯
      </div>
    </div>
    <div class="arrow">VS</div>
    <div class="card highlight">
      <div class="card-tag" style="background: #dcfce7; color: #15803d;">✅ 專業做法 (Single Source of Truth)</div>
      <div class="card-title">先完成 PRD.md 需求藍圖</div>
      <div class="card-desc">
        「確立目標、受眾、侘寂風格色調、三欄菜單與地圖。」<br>
        <strong>成果：</strong><br>
        • 建立專案唯一真相來源<br>
        • AI 分毫不差地精確執行實作<br>
        • 產出具備商業質感的量身作品
      </div>
    </div>
  </div>
</div>
</body></html>

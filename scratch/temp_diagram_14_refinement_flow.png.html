<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 30px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    display: inline-block;
  }
  .container {
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 40px;
    box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.05);
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 1100px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 16px;
  }
  .header-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: white;
  }
  .header-title {
    font-size: 22px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
  }
  .header-subtitle {
    font-size: 14px;
    color: #64748b;
    margin-top: 2px;
  }
  .flow-row {
    display: flex;
    align-items: stretch;
    gap: 16px;
  }
  .card {
    flex: 1;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    transition: all 0.2s;
  }
  .card.highlight {
    background: #f0fdf4;
    border-color: #86efac;
    box-shadow: 0 4px 20px rgba(34, 197, 94, 0.12);
  }
  .card.primary {
    background: #eff6ff;
    border-color: #93c5fd;
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12);
  }
  .card.purple {
    background: #faf5ff;
    border-color: #d8b4fe;
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.12);
  }
  .card.amber {
    background: #fffbeb;
    border-color: #fde68a;
    box-shadow: 0 4px 20px rgba(245, 158, 11, 0.12);
  }
  .card-tag {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 9999px;
    width: fit-content;
  }
  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: #1e293b;
  }
  .card-desc {
    font-size: 14px;
    color: #475569;
    line-height: 1.6;
  }
  .card-list {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
    color: #475569;
    line-height: 1.6;
  }
  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 24px;
    font-weight: bold;
    padding: 0 4px;
  }
</style></head><body>
<div class="container" style="width: 1020px;">
  <div class="header">
    <div class="header-icon" style="background: linear-gradient(135deg, #10b981, #059669);">🏆</div>
    <div>
      <div class="header-title">Phase 3 完善與發布兩階段路徑</div>
      <div class="header-subtitle">從 70 分工程師原型，打磨到 100 分商業交付官網</div>
    </div>
  </div>
  <div class="flow-row">
    <div class="card">
      <div class="card-tag" style="background: #e2e8f0; color: #475569;">起點</div>
      <div class="card-title">70 分 AI 初版原型</div>
      <div class="card-desc">
        • 版型骨架完整<br>
        • 手機端排版可能擠壓<br>
        • 仍有部分假字與細節生硬
      </div>
    </div>
    <div class="arrow">➔</div>
    <div class="card primary">
      <div class="card-tag" style="background: #dbeafe; color: #1e40af;">第 14 週品管微調</div>
      <div class="card-title">成為 AI 品管師 (QA)</div>
      <div class="card-desc">
        • 終端啟動本機預覽伺服器<br>
        • F12 跨裝置手機 RWD 排查<br>
        • 思源宋體導入與行高微調<br>
        • 消除所有假字，換上真文案
      </div>
    </div>
    <div class="arrow">➔</div>
    <div class="card highlight">
      <div class="card-tag" style="background: #dcfce7; color: #15803d;">第 15 週發布展評</div>
      <div class="card-title">正式發布全世界</div>
      <div class="card-desc">
        • GitHub Pages 部署上線<br>
        • 雙向串聯個人作品集<br>
        • 線上 Showcase 互評發表<br>
        • 100 分個人數位代表作
      </div>
    </div>
  </div>
</div>
</body></html>
